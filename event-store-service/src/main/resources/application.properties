spring.application.name=event-store-service
server.port=8082






spring.datasource.url=jdbc:postgresql://localhost:5432/apivault
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
springdoc.swagger-ui.path=/swagger-ui

# Disable Flyway for H2 — flyway-database-postgresql is Postgres-only.
# Flyway is enabled via env override when running against Postgres.


# ========================
# OPTIONAL → POSTGRES (override using env variables)
# ========================
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASS}
# spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# ACTUATOR
# ========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always