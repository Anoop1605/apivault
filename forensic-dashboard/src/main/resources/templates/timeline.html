<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sentinel — Event Timeline</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        nav { margin-bottom: 20px; }
        nav a { color: #58a6ff; margin-right: 16px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .session-id { color: #8b949e; font-size: 13px; margin-bottom: 16px; }
        .error { color: #f85149; background: #1c0a0a; padding: 10px; border-radius: 4px; margin: 12px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th { background: #161b22; color: #8b949e; text-align: left; padding: 10px 12px; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 13px; }
        tr:hover td { background: #161b22; }
        .allow  { color: #3fb950; font-weight: bold; }
        .block  { color: #f85149; font-weight: bold; }
        .review { color: #d29922; font-weight: bold; }
        .empty  { color: #8b949e; text-align: center; padding: 48px; }
        .back   { color: #58a6ff; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
<nav>
    <a href="/dashboard">Sessions</a>
    <a href="/dashboard/alerts">Alerts</a>
</nav>
<h1>Event Timeline</h1>
<div class="session-id">Session: <span th:text="${sessionId}">-</span></div>
<a class="back" href="/dashboard">&larr; Back to sessions</a>

<div th:if="${error}" class="error" th:text="${error}"></div>

<table th:unless="${#lists.isEmpty(timeline)}">
    <thead>
        <tr>
            <th>#</th>
            <th>Timestamp (ns)</th>
            <th>Event Type</th>
            <th>Decision</th>
            <th>Rule Matched</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="step, iter : ${timeline}">
            <td th:text="${iter.count}">1</td>
            <td th:text="${step['timestampNs']}">-</td>
            <td th:text="${step['eventType']}">-</td>
            <td>
                <span th:if="${step['decision'] == 'ALLOW'}"  class="allow"  th:text="${step['decision']}">ALLOW</span>
                <span th:if="${step['decision'] == 'BLOCK'}"  class="block"  th:text="${step['decision']}">BLOCK</span>
                <span th:if="${step['decision'] == 'REVIEW'}" class="review" th:text="${step['decision']}">REVIEW</span>
                <span th:if="${step['decision'] == null}">-</span>
            </td>
            <td th:text="${step['ruleMatched'] != null ? step['ruleMatched'] : '-'}">-</td>
        </tr>
    </tbody>
</table>

<div class="empty" th:if="${#lists.isEmpty(timeline)}">
    No events found for this session.
</div>
</body>
</html>
