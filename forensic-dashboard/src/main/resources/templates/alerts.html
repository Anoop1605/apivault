<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sentinel — Alerts</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; }
        h1 { color: #f85149; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        nav { margin-bottom: 20px; }
        nav a { color: #58a6ff; margin-right: 16px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .error { color: #f85149; background: #1c0a0a; padding: 10px; border-radius: 4px; margin: 12px 0; }
        .session-id { color: #8b949e; font-size: 13px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th { background: #161b22; color: #8b949e; text-align: left; padding: 10px 12px; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 13px; }
        tr:hover td { background: #161b22; }
        .HIGH     { color: #f85149; font-weight: bold; }
        .CRITICAL { color: #ff0000; font-weight: bold; }
        .MEDIUM   { color: #d29922; }
        .LOW      { color: #8b949e; }
        .empty { color: #8b949e; text-align: center; padding: 48px; }
        .back  { color: #58a6ff; text-decoration: none; font-size: 13px; }
        .badge-count { background: #f85149; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        a.link { color: #58a6ff; text-decoration: none; }
        a.link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<nav>
    <a href="/dashboard">Sessions</a>
    <a href="/dashboard/alerts">Alerts</a>
</nav>
<h1>
    Alert List
    <span th:if="${alerts != null and not #lists.isEmpty(alerts)}"
          class="badge-count" th:text="${#lists.size(alerts)}">0</span>
</h1>

<div th:if="${sessionId != null}" class="session-id">
    Session: <span th:text="${sessionId}">-</span>
    &nbsp;|&nbsp;
    <a class="back" th:href="@{/dashboard/sessions/{id}/timeline(id=${sessionId})}">&larr; Back to timeline</a>
</div>

<div th:if="${sessions != null and not #lists.isEmpty(sessions)}">
    <p style="color:#8b949e; font-size:13px;">Click a session to view its alerts:</p>
    <table>
        <thead><tr><th>Session ID</th><th>Actions</th></tr></thead>
        <tbody>
            <tr th:each="s : ${sessions}">
                <td style="font-size:11px;" th:text="${s['sessionId']}">-</td>
                <td><a class="link" th:href="@{/dashboard/alerts/{id}(id=${s['sessionId']})}">View Alerts</a></td>
            </tr>
        </tbody>
    </table>
</div>

<div th:if="${error}" class="error" th:text="${error}"></div>

<table th:if="${alerts != null and not #lists.isEmpty(alerts)}">
    <thead>
        <tr>
            <th>Timestamp (ns)</th>
            <th>Event Type</th>
            <th>Severity</th>
            <th>Message</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="alert : ${alerts}">
            <td th:text="${alert['timestampNs']}">-</td>
            <td th:text="${alert['triggerEventType']}">-</td>
            <td>
                <span th:class="${alert['severity']}" th:text="${alert['severity']}">-</span>
            </td>
            <td th:text="${alert['message']}">-</td>
        </tr>
    </tbody>
</table>

<div class="empty" th:if="${alerts != null and #lists.isEmpty(alerts)}">
    No alerts for this session. All events were within policy.
</div>
</body>
</html>
