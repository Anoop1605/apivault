<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sentinel — Session Explorer</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        nav { margin-bottom: 20px; }
        nav a { color: #58a6ff; margin-right: 16px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .error { color: #f85149; background: #1c0a0a; padding: 10px; border-radius: 4px; margin: 12px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th { background: #161b22; color: #8b949e; text-align: left; padding: 10px 12px; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 13px; }
        tr:hover td { background: #161b22; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .badge-events { background: #1f3a5f; color: #58a6ff; }
        a.link { color: #58a6ff; text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        .empty { color: #8b949e; text-align: center; padding: 48px; }
    </style>
</head>
<body>
<nav>
    <a href="/dashboard">Sessions</a>
    <a href="/dashboard/alerts">Alerts</a>
</nav>
<h1>Session Explorer</h1>

<div th:if="${error}" class="error" th:text="${error}"></div>

<table th:unless="${#lists.isEmpty(sessions)}">
    <thead>
        <tr>
            <th>Session ID</th>
            <th>Events</th>
            <th>Start (ns)</th>
            <th>End (ns)</th>
            <th>Hash (truncated)</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="s : ${sessions}">
            <td style="font-size:11px;" th:text="${s['sessionId']}">-</td>
            <td><span class="badge badge-events" th:text="${s['eventCount']}">0</span></td>
            <td th:text="${s['startTimestampNs']}">-</td>
            <td th:text="${s['endTimestampNs']}">-</td>
            <td style="font-size:11px; color:#8b949e;"
                th:text="${s['hash'] != null ? #strings.substring(s['hash'], 0, 16) + '...' : '-'}">-</td>
            <td>
                <a class="link" th:href="@{/dashboard/sessions/{id}/timeline(id=${s['sessionId']})}">Timeline</a>
                &nbsp;|&nbsp;
                <a class="link" th:href="@{/dashboard/sessions/{id}/policy-trace(id=${s['sessionId']})}">Policy Trace</a>
                &nbsp;|&nbsp;
                <a class="link" th:href="@{/dashboard/alerts/{id}(id=${s['sessionId']})}">Alerts</a>
                &nbsp;|&nbsp;
                <a class="link" th:href="@{/dashboard/sessions/{id}/whatif(id=${s['sessionId']})}">What-If</a>
            </td>
        </tr>
    </tbody>
</table>

<div class="empty" th:if="${#lists.isEmpty(sessions)}">
    No sessions found. Ensure forensics-replay-service is running on port 8083.
</div>
</body>
</html>
