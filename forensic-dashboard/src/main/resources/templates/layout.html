<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title th:text="${pageTitle} ?: 'Obsidian Sec'">Obsidian Sec</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#292a60",
                        "surface-container-lowest": "#0a0e14",
                        "secondary-container": "#42447b",
                        "on-error": "#690005",
                        "surface-tint": "#c0c1ff",
                        "primary-fixed": "#e1e0ff",
                        "outline-variant": "#464554",
                        "surface-container-low": "#181c22",
                        "on-tertiary-container": "#452000",
                        "on-secondary-fixed-variant": "#404178",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-primary": "#1000a9",
                        "primary-container": "#8083ff",
                        "error": "#ffb4ab",
                        "primary": "#c0c1ff",
                        "background": "#10141a",
                        "tertiary-container": "#d97721",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "secondary": "#c0c1ff",
                        "on-primary-fixed": "#07006c",
                        "on-surface-variant": "#c7c4d7",
                        "surface-variant": "#31353c",
                        "on-background": "#dfe2eb",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#301400",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#13144a",
                        "tertiary-fixed": "#ffdcc5",
                        "inverse-primary": "#494bd6",
                        "surface": "#10141a",
                        "surface-bright": "#353940",
                        "tertiary": "#ffb783",
                        "tertiary-fixed-dim": "#ffb783",
                        "surface-container-highest": "#31353c",
                        "on-secondary-container": "#b2b3f2",
                        "secondary-fixed": "#e1e0ff",
                        "on-tertiary-fixed-variant": "#703700",
                        "on-surface": "#dfe2eb",
                        "inverse-on-surface": "#2d3137",
                        "surface-dim": "#10141a",
                        "inverse-surface": "#dfe2eb",
                        "outline": "#908fa0",
                        "surface-container-high": "#262a31",
                        "on-primary-container": "#0d0096",
                        "secondary-fixed-dim": "#c0c1ff",
                        "surface-container": "#1c2026",
                        "on-tertiary": "#4f2500"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #10141a; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-pulse { background: rgba(49, 53, 60, 0.4); backdrop-filter: blur(12px); }
        .silk-gradient { background: linear-gradient(135deg, #c0c1ff 0%, #8083ff 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #10141a; }
        ::-webkit-scrollbar-thumb { background: #31353c; border-radius: 10px; }
    </style>
</head>
<body class="text-on-background bg-surface-dim selection:bg-primary/30">

<!-- SideNavBar -->
<aside class="h-screen w-64 fixed left-0 top-0 bg-slate-950 dark:bg-[#10141a] font-['Plus_Jakarta_Sans'] text-sm tracking-tight flex flex-col h-full py-6 z-50">
    <div class="px-6 mb-8">
        <h1 class="text-xl font-bold tracking-tighter text-indigo-400 dark:text-[#c0c1ff]">NYXSEC</h1>
        <p class="text-xs text-slate-500 uppercase tracking-widest mt-1">Admin Console</p>
    </div>
    <nav class="flex-1 space-y-1 px-3">
        <a th:href="@{/dashboard}" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150" th:classappend="${currentPage == 'dashboard' ? 'text-indigo-400 dark:text-[#c0c1ff] font-semibold border-r-2 border-indigo-500' : ''}">
            <span class="material-symbols-outlined">dashboard</span>
            Dashboard
        </a>
        <a th:href="@{/timeline}" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150" th:classappend="${currentPage == 'timeline' ? 'text-indigo-400 dark:text-[#c0c1ff] font-semibold border-r-2 border-indigo-500' : ''}">
            <span class="material-symbols-outlined">timeline</span>
            Event Timeline
        </a>
        <a th:href="@{/session-explorer}" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150" th:classappend="${currentPage == 'session-explorer' ? 'text-indigo-400 dark:text-[#c0c1ff] font-semibold border-r-2 border-indigo-500' : ''}">
            <span class="material-symbols-outlined">person_search</span>
            Session Explorer
        </a>
        <a th:href="@{/policy-trace}" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150" th:classappend="${currentPage == 'policy-trace' ? 'text-indigo-400 dark:text-[#c0c1ff] font-semibold border-r-2 border-indigo-500' : ''}">
            <span class="material-symbols-outlined">rule</span>
            Policy Trace
        </a>
        <a th:href="@{/replay}" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150" th:classappend="${currentPage == 'replay' ? 'text-indigo-400 dark:text-[#c0c1ff] font-semibold border-r-2 border-indigo-500' : ''}">
            <span class="material-symbols-outlined">replay</span>
            Replay
        </a>
        <a th:href="@{/whatif}" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150" th:classappend="${currentPage == 'whatif' ? 'text-indigo-400 dark:text-[#c0c1ff] font-semibold border-r-2 border-indigo-500' : ''}">
            <span class="material-symbols-outlined">science</span>
            Simulation
        </a>
        <a th:href="@{/alerts}" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150" th:classappend="${currentPage == 'alerts' ? 'text-indigo-400 dark:text-[#c0c1ff] font-semibold border-r-2 border-indigo-500' : ''}">
            <span class="material-symbols-outlined">notifications</span>
            Alerts
        </a>
        <a th:href="@{/metrics}" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150" th:classappend="${currentPage == 'metrics' ? 'text-indigo-400 dark:text-[#c0c1ff] font-semibold border-r-2 border-indigo-500' : ''}">
            <span class="material-symbols-outlined">monitoring</span>
            Metrics
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 dark:text-[#c7c4d7] hover:bg-[#1c2026] hover:text-white transition-colors scale-95 active:scale-90 duration-150">
            <span class="material-symbols-outlined">settings</span>
            Settings
        </a>
    </nav>
    <div class="px-6 mt-auto">
        <div class="p-4 rounded-xl bg-surface-container-low border border-outline-variant/10">
            <p class="text-[10px] text-on-surface-variant uppercase tracking-tighter mb-2">System Health</p>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-secondary animate-pulse"></div>
                <span class="text-xs font-medium">Nodes Active</span>
            </div>
        </div>
    </div>
</aside>

<!-- TopNavBar -->
<header class="fixed top-0 right-0 w-[calc(100%-16rem)] h-16 z-40 bg-slate-950/80 dark:bg-[#10141a]/80 backdrop-blur-xl flex justify-between items-center px-8 w-full font-['Plus_Jakarta_Sans'] text-sm">
    <div class="flex items-center gap-4 flex-1">
        <div class="relative w-full max-w-md">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span>
            <input class="w-full bg-surface-container-lowest border-none rounded-lg pl-10 pr-4 py-2 text-on-surface focus:ring-1 focus:ring-primary text-sm transition-all" placeholder="Search sessions, IPs, or endpoints..." type="text"/>
        </div>
    </div>
    <div class="flex items-center gap-6">
        <div class="flex items-center gap-4 text-slate-400 dark:text-[#c7c4d7]">
            <button class="material-symbols-outlined hover:text-white transition-colors opacity-80 hover:opacity-100">schedule</button>
            <button class="material-symbols-outlined hover:text-white transition-colors opacity-80 hover:opacity-100">refresh</button>
        </div>
        <div class="h-6 w-[1px] bg-outline-variant/20"></div>
        <button class="px-4 py-1.5 silk-gradient text-on-primary font-semibold rounded-lg text-xs tracking-tight shadow-lg shadow-primary/10">
            Admin Role
        </button>
    </div>
</header>

<!-- Main Content - Rendered by Child Templates -->
<main class="ml-64 pt-20 p-8 min-h-screen">
    <th:block th:include="this :: content"></th:block>
</main>

</body>
</html>
