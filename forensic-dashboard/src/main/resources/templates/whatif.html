<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sentinel — What-If Simulation</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        nav { margin-bottom: 20px; }
        nav a { color: #58a6ff; margin-right: 16px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .session-id { color: #8b949e; font-size: 13px; margin-bottom: 16px; }
        .error { color: #f85149; background: #1c0a0a; padding: 10px; border-radius: 4px; margin: 12px 0; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        .card h3 { margin: 0 0 12px 0; color: #58a6ff; font-size: 14px; }
        label { display: block; color: #8b949e; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; }
        textarea {
            width: 100%; box-sizing: border-box;
            background: #0d1117; color: #c9d1d9;
            border: 1px solid #30363d; border-radius: 4px;
            padding: 10px; font-family: monospace; font-size: 13px;
            resize: vertical; min-height: 80px;
        }
        textarea:focus { outline: none; border-color: #58a6ff; }
        button {
            background: #238636; color: white;
            border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer;
            font-family: monospace; font-size: 13px;
            margin-top: 12px;
        }
        button:hover { background: #2ea043; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th { background: #161b22; color: #8b949e; text-align: left; padding: 10px 12px; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 13px; }
        .allow  { color: #3fb950; font-weight: bold; }
        .block  { color: #f85149; font-weight: bold; }
        .back   { color: #58a6ff; text-decoration: none; font-size: 13px; }
        .hint   { color: #8b949e; font-size: 12px; margin-top: 6px; }
    </style>
</head>
<body>
<nav>
    <a href="/dashboard">Sessions</a>
    <a href="/dashboard/alerts">Alerts</a>
</nav>
<h1>What-If Simulation</h1>
<div class="session-id">Session: <span th:text="${sessionId}">-</span></div>
<a class="back" th:href="@{/dashboard/sessions/{id}/timeline(id=${sessionId})}">&larr; Back to timeline</a>

<div th:if="${error}" class="error" th:text="${error}"></div>

<div class="card" style="margin-top: 16px;">
    <h3>Alternate Policy Rules</h3>
    <form th:action="@{/dashboard/sessions/{id}/whatif(id=${sessionId})}" method="post">
        <label for="rules">Enter alternate rules (comma-separated)</label>
        <textarea id="rules" name="rules" placeholder="e.g. BLOCK_ALL_DELETE,REQUIRE_MFA,BLOCK_AFTER_HOURS"
                  th:text="${rules}"></textarea>
        <div class="hint">These rules replace the original policy for this simulation only.</div>
        <button type="submit">Run Simulation</button>
    </form>
</div>

<div th:if="${report != null and not #maps.isEmpty(report)}" class="card">
    <h3>Simulation Result</h3>
    <table>
        <thead>
            <tr>
                <th>Step</th>
                <th>Session ID</th>
                <th>Hash</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td th:text="${#lists.size(report['steps'] != null ? report['steps'] : {})}">0</td>
                <td th:text="${report['sessionId']}">-</td>
                <td style="font-size:11px; color:#8b949e;"
                    th:text="${report['hash'] != null ? #strings.substring(report['hash'], 0, 24) + '...' : '-'}">-</td>
            </tr>
        </tbody>
    </table>

    <div style="margin-top: 12px; color: #8b949e; font-size: 13px;">
        Steps reconstructed: <span th:text="${#lists.size(report['steps'] != null ? report['steps'] : {})}">0</span>
    </div>
</div>
</body>
</html>
