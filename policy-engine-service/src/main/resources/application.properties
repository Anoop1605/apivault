spring.application.name=policy-engine-service
server.port=8082

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sentinel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentinel_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sentinel_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin
