version: '3.8'

services:
  # 1. The ABAC Policy Engine & Risk Scorer
  policy-engine:
    build: ./policy-engine-service
    container_name: sentinel-policy-engine
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sentinel_db
      - SPRING_DATASOURCE_USERNAME=sentinel
      - SPRING_DATASOURCE_PASSWORD=sentinel
    depends_on:
      - postgres
    networks:
      - sentinel-network

  # 2. The Forensics & Replay Service
  forensics-service:
    build: ./forensics-replay-service
    container_name: sentinel-forensics-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      # Overriding the localhost values to use Docker's internal DNS!
      - POLICY_ENGINE_URL=http://policy-engine:8082
      - EVENTSTORE_BASE_URL=http://event-store:8081
    depends_on:
      - policy-engine
    networks:
      - sentinel-network

  # 3. PostgreSQL Database (For when we move away from Mock Data)
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    environment:
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=sentinel
      - POSTGRES_DB=sentinel_db
    ports:
      - "5432:5432"
    networks:
      - sentinel-network

  event-store:
    build: ./event-store-service
    container_name: sentinel-event-store
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sentinel_db
      - SPRING_DATASOURCE_USERNAME=sentinel
      - SPRING_DATASOURCE_PASSWORD=sentinel
    depends_on:
      - postgres
    networks:
      - sentinel-network

  gateway:
    build: ./gateway-service
    container_name: sentinel-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EVENT_STORE_URL=http://event-store:8081
      - PAYMENT_SERVICE_URL=http://payment-service:9001
      - USER_SERVICE_URL=http://user-service:9002
      - ADMIN_SERVICE_URL=http://admin-service:9003
    depends_on:
      - event-store
    networks:
      - sentinel-network

  payment-service:
    build: ./backend-mock-services/payment-service
    container_name: sentinel-payment-service
    ports:
      - "9001:9001"
    networks:
      - sentinel-network

  user-service:
    build: ./backend-mock-services/user-service
    container_name: sentinel-user-service
    ports:
      - "9002:9002"
    networks:
      - sentinel-network

  admin-service:
    build: ./backend-mock-services/admin-service
    container_name: sentinel-admin-service
    ports:
      - "9003:9003"
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge