spring.application.name=forensics-replay-service
server.port=8083

# Disable DB auto-configuration for local testing (no DB required)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Event Store integration
# Set use-mock=false when event-store-service is running with a real DB
event-store.use-mock=false
event-store.base-url=${EVENTSTORE_BASE_URL:http://localhost:8081}

# Security - disable for local dev
spring.security.user.name=admin
spring.security.user.password=admin
spring.main.allow-bean-definition-overriding=true
